name: Deploy zu IONOS

# Läuft bei jedem Push auf main und auf Knopfdruck (Actions → "Deploy zu IONOS" → Run workflow).
# Überträgt die Seite per SFTP in den IONOS-Webspace. Zugangsdaten liegen als Repository-Secrets:
#   IONOS_SFTP_HOST      z. B. access-5017xxxxxx.webspace-host.com  (IONOS → Hosting → SFTP/SSH-Zugang)
#   IONOS_SFTP_USER      z. B. u123456789 oder acc123456789
#   IONOS_SFTP_PASSWORD  das Passwort des SFTP-Nutzers
#   IONOS_TARGET_DIR     optional; Zielverzeichnis im Webspace, Standard "/" (das Verzeichnis, dem flaconella.de zugeordnet ist)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    name: Seite hochladen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Secrets prüfen
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$IONOS_SFTP_HOST" ] && missing="$missing IONOS_SFTP_HOST"
          [ -z "$IONOS_SFTP_USER" ] && missing="$missing IONOS_SFTP_USER"
          [ -z "$IONOS_SFTP_PASSWORD" ] && missing="$missing IONOS_SFTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Repository-Secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Upload-Verzeichnis zusammenstellen
        run: |
          mkdir -p dist
          rsync -a --exclude-from=.deployignore ./ dist/
          echo "Dateien im Upload:"; find dist -type f | sort | sed 's#^dist/#  #'

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP hochladen
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_TARGET_DIR: ${{ secrets.IONOS_TARGET_DIR }}
        run: |
          TARGET="${IONOS_TARGET_DIR:-/}"
          echo "Ziel: sftp://$IONOS_SFTP_HOST$TARGET"
          # mirror -R: lokal → Server. Nur geänderte Dateien werden übertragen; nichts wird auf dem Server gelöscht.
          lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASSWORD" "sftp://$IONOS_SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR';
            set net:max-retries 3;
            set net:timeout 30;
            set xfer:log 1;
            mirror -R --verbose=1 --only-newer --no-perms dist/ \"$TARGET\";
            quit
          "
          echo "Upload abgeschlossen."

      - name: Erreichbarkeit prüfen
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://flaconella.de/ || echo 000)
          echo "https://flaconella.de/ antwortet mit HTTP $code"
          if [ "$code" != "200" ]; then echo "::warning::Seite antwortet nicht mit 200 – Domain-Zuordnung oder SSL in IONOS prüfen."; fi
